<!doctype html>
<html lang="en" data-theme="paper">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PR Overview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500;1,9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
  <style>/* pr-overview visual system — editorial PR explainer.
   Two themes: 'paper' (default, warm cream + green + ochre) and 'dark'.
   Inspired by branch-notes long-form PR explainers. */

/* ---------- theme tokens ---------- */
:root[data-theme="paper"] {
  --paper:        #f3efe6;
  --paper-tint:   #ece5d5;
  --surface:      #fbf9f3;
  --ink:          #211e19;
  --ink-soft:     #5b5347;
  --ink-faint:    #938976;
  --line:         #ddd4bf;
  --line-soft:    #e7dfcc;
  --accent:       #15604c;
  --accent-deep:  #0d4234;
  --accent-tint:  #e3ece6;
  --ochre:        #a96e1f;
  --ochre-tint:   #f0e6cf;
  --clay:         #a4452c;
  --clay-tint:    #f0e0d6;

  --added:        #15604c;
  --added-tint:   #e3ece6;
  --added-border: #bcd2c8;
  --changed:      #355b94;
  --changed-tint: #e1e8f3;
  --changed-border:#bccadd;
  --removed:      #a4452c;
  --removed-tint: #f0e0d6;
  --removed-border:#dab9a8;
  --privacy:      #a96e1f;

  --shadow:       0 1px 2px rgba(33,30,25,.04), 0 14px 34px -22px rgba(33,30,25,.30);
  --shadow-lift:  0 2px 4px rgba(33,30,25,.05), 0 26px 50px -26px rgba(33,30,25,.38);

  --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
  --sans:  'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono:  'IBM Plex Mono', ui-monospace, Menlo, monospace;
}

:root[data-theme="dark"] {
  --paper:        #0e1116;
  --paper-tint:   #161b22;
  --surface:      #161b22;
  --ink:          #e6edf3;
  --ink-soft:     #c9d1d9;
  --ink-faint:    #8b949e;
  --line:         #30363d;
  --line-soft:    #21262d;
  --accent:       #3fb950;
  --accent-deep:  #1a7f37;
  --accent-tint:  rgba(63,185,80,0.12);
  --ochre:        #d29922;
  --ochre-tint:   rgba(210,153,34,0.12);
  --clay:         #f85149;
  --clay-tint:    rgba(248,81,73,0.12);

  --added:        #3fb950;
  --added-tint:   rgba(63,185,80,0.15);
  --added-border: rgba(63,185,80,0.45);
  --changed:      #58a6ff;
  --changed-tint: rgba(88,166,255,0.15);
  --changed-border:rgba(88,166,255,0.45);
  --removed:      #f85149;
  --removed-tint: rgba(248,81,73,0.15);
  --removed-border:rgba(248,81,73,0.45);
  --privacy:      #d29922;

  --shadow:       0 1px 2px rgba(0,0,0,.4), 0 14px 34px -22px rgba(0,0,0,.7);
  --shadow-lift:  0 2px 4px rgba(0,0,0,.5), 0 26px 50px -26px rgba(0,0,0,.85);

  --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
  --sans:  'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono:  'IBM Plex Mono', ui-monospace, Menlo, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
::selection { background: var(--accent); color: var(--paper); }
a { color: inherit; }

/* ---------- scroll progress ---------- */
.progress {
  position: fixed; top: 0; left: 0; height: 3px; width: 0%;
  z-index: 60;
  background: linear-gradient(90deg, var(--accent), var(--ochre));
  transition: width .12s linear;
}

/* ---------- layout shell ---------- */
.shell {
  position: relative; z-index: 1;
  display: grid;
  grid-template-columns: 260px 1fr;
  max-width: 1320px;
  margin: 0 auto;
}

/* ---------- left rail ---------- */
nav.rail {
  position: sticky; top: 0;
  align-self: start;
  height: 100vh;
  padding: 42px 24px 24px 40px;
  display: flex; flex-direction: column;
  border-right: 1px solid var(--line);
}
.rail__brand {
  font-family: var(--mono); font-size: 12px;
  letter-spacing: .14em; text-transform: uppercase;
  color: var(--accent); font-weight: 500;
  display: flex; gap: 10px;
}
.rail__brand b { color: var(--ink); font-weight: 500; }
.rail__title {
  font-family: var(--serif); font-size: 21px; line-height: 1.25;
  margin: 18px 0 30px; font-weight: 500;
  font-variation-settings: 'SOFT' 30, 'WONK' 0;
}
.rail ol {
  list-style: none;
  display: flex; flex-direction: column; gap: 2px;
  border-left: 1px solid var(--line);
}
.rail a {
  display: flex; gap: 11px; padding: 8px 0 8px 16px;
  margin-left: -1px;
  border-left: 1px solid transparent;
  font-size: 13.5px; color: var(--ink-faint);
  text-decoration: none; transition: .25s;
  align-items: baseline;
}
.rail a .n { font-family: var(--mono); font-size: 11px; }
.rail a:hover { color: var(--ink-soft); }
.rail a.is-active {
  color: var(--ink); border-left-color: var(--accent); font-weight: 500;
}
.rail a.is-active .n { color: var(--accent); }
.rail__foot {
  margin-top: auto; padding-top: 26px;
  font-family: var(--mono); font-size: 11px;
  color: var(--ink-faint); line-height: 1.7;
  display: flex; flex-direction: column; gap: 4px;
}
.rail__foot button {
  margin-top: 14px;
  background: transparent; color: var(--ink-faint);
  border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 10px; cursor: pointer;
  font-family: var(--mono); font-size: 11px;
  display: flex; gap: 6px; align-items: center; justify-content: center;
  text-transform: uppercase; letter-spacing: .06em;
  transition: .2s;
}
.rail__foot button:hover { color: var(--ink); border-color: var(--ink-faint); }

/* ---------- main column ---------- */
main.main {
  min-width: 0;
  padding: 0 56px;
}
section.section {
  padding: 92px 0;
  border-bottom: 1px solid var(--line-soft);
  max-width: 820px;
}
section.section:last-of-type { border-bottom: none; }
.section--wide { max-width: none; }

/* ---------- type ---------- */
.kicker {
  font-family: var(--mono); font-size: 12px;
  letter-spacing: .16em; text-transform: uppercase;
  color: var(--accent);
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 22px;
}
.kicker__num {
  background: var(--accent); color: var(--paper);
  padding: 2px 8px; border-radius: 3px; font-weight: 500;
}
.section h2 {
  font-family: var(--serif); font-weight: 500;
  font-size: clamp(28px, 4.2vw, 42px);
  line-height: 1.08; letter-spacing: -.015em;
  font-variation-settings: 'SOFT' 40, 'WONK' 1;
  margin-bottom: 22px;
  color: var(--ink);
}
.section h2 em { font-style: italic; color: var(--accent); }
.section h3 {
  font-family: var(--serif); font-weight: 500;
  font-size: 22px; line-height: 1.25;
  margin: 0 0 6px;
  color: var(--ink);
}
.section p {
  margin: 0 0 18px;
  color: var(--ink-soft);
}
.section p strong { color: var(--ink); font-weight: 600; }
.section p:last-child { margin-bottom: 0; }
.lead { font-size: 19px; line-height: 1.55; color: var(--ink); }
code {
  font-family: var(--mono); font-size: .86em;
  background: var(--paper-tint);
  padding: 1.5px 5px; border-radius: 4px;
  color: var(--accent-deep);
  border: 1px solid var(--line-soft);
}
:root[data-theme="dark"] code { color: var(--accent); }

/* ---------- hero ---------- */
.hero {
  padding: 110px 0 90px;
  max-width: 920px;
  border-bottom: 1px solid var(--line-soft);
}
.hero__eyebrow {
  font-family: var(--mono); font-size: 12px;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-faint);
  display: flex; flex-wrap: wrap; gap: 8px 18px;
  margin-bottom: 28px;
}
.hero__tag { color: var(--accent); }
.hero__tag::before {
  content: "●"; font-size: 7px; vertical-align: middle; margin-right: 7px;
}
.hero__title {
  font-family: var(--serif); font-weight: 500;
  font-size: clamp(38px, 6vw, 70px);
  line-height: 1.04; letter-spacing: -.025em;
  font-variation-settings: 'SOFT' 30, 'WONK' 1;
  margin-bottom: 28px;
  color: var(--ink);
}
.hero__title em { font-style: italic; color: var(--accent); }
.hero__stand {
  font-size: 20px; line-height: 1.6;
  color: var(--ink-soft);
  max-width: 660px;
  margin: 0;
}
.hero__scroll {
  margin-top: 48px;
  font-family: var(--mono); font-size: 11.5px;
  letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-faint);
  display: flex; align-items: center; gap: 10px;
}
.hero__scroll-dash {
  width: 38px; height: 1px; background: var(--ink-faint);
  position: relative; overflow: hidden;
}
.hero__scroll-dash::after {
  content: ""; position: absolute; inset: 0;
  width: 14px; background: var(--accent);
  animation: slide 1.9s infinite ease-in-out;
}
@keyframes slide {
  0% { transform: translateX(-16px); }
  100% { transform: translateX(40px); }
}

/* ---------- "Why" gap cards ---------- */
.gaps {
  display: flex; flex-direction: column; gap: 14px;
  margin-top: 32px;
}
.gap {
  display: grid; grid-template-columns: 46px 1fr; gap: 18px;
  background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px;
  padding: 22px 24px;
  box-shadow: var(--shadow);
}
.gap__ic {
  width: 46px; height: 46px; border-radius: 10px;
  display: grid; place-items: center;
  font-size: 20px;
  background: var(--clay-tint); border: 1px solid var(--clay);
  color: var(--clay);
  font-family: var(--mono); font-weight: 500;
}
.gap h3 { font-size: 18px; margin-bottom: 3px; }
.gap p { font-size: 15px; margin: 0; }

/* ---------- principles ---------- */
.principles {
  display: grid; grid-template-columns: 1fr 1fr; gap: 13px;
  margin-top: 28px;
}
.principle {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 11px; padding: 18px 19px;
}
.principle__t {
  font-family: var(--mono); font-size: 11px;
  letter-spacing: .06em; text-transform: uppercase;
  color: var(--ochre); margin-bottom: 6px; font-weight: 500;
}
.principle p { font-size: 14px; margin: 0; }

/* ---------- callouts ---------- */
.callout {
  display: grid; grid-template-columns: auto 1fr; gap: 13px;
  background: var(--ochre-tint);
  border: 1px solid var(--ochre); border-radius: 11px;
  padding: 15px 17px;
  margin-top: 18px;
  font-size: 14px;
  color: var(--ink-soft);
}
.callout__ic { font-size: 17px; color: var(--ochre); }
.callout b { color: var(--accent-deep); }
:root[data-theme="dark"] .callout b { color: var(--accent); }
.callout--review {
  background: var(--clay-tint);
  border-color: var(--clay);
}
.callout--review .callout__ic { color: var(--clay); }
.callout--question {
  background: var(--accent-tint);
  border-color: var(--accent);
}
.callout--question .callout__ic { color: var(--accent); }

/* ---------- file chip ---------- */
.file-chip {
  display: inline-flex; padding: 2px 7px; font-size: 11.5px;
  border: 1px solid var(--line-soft); border-radius: 5px;
  cursor: copy;
  font-family: var(--mono); color: var(--accent-deep);
  background: var(--accent-tint);
  white-space: nowrap;
}
:root[data-theme="dark"] .file-chip { color: var(--accent); }
.file-chip:hover { border-color: var(--accent); }

/* ---------- specifics (collapsible) ---------- */
details.spec {
  background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px;
  margin-top: 16px; overflow: hidden;
  box-shadow: var(--shadow);
}
details.spec summary {
  cursor: pointer; list-style: none;
  padding: 17px 22px;
  display: flex; align-items: center; gap: 12px;
  font-family: var(--mono); font-size: 12.5px;
  letter-spacing: .04em; text-transform: uppercase;
  color: var(--ink); font-weight: 500;
  user-select: none;
}
details.spec summary::-webkit-details-marker { display: none; }
details.spec summary .chev {
  margin-left: auto; width: 18px; height: 18px;
  display: grid; place-items: center;
  transition: transform .3s;
  color: var(--accent);
}
details.spec[open] summary .chev { transform: rotate(90deg); }
details.spec summary .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent);
}
.spec__body { padding: 4px 22px 24px; }
.spec__body ul {
  list-style: none;
  display: flex; flex-direction: column; gap: 13px;
  margin: 6px 0 0;
}
.spec__body li {
  display: grid; grid-template-columns: auto 1fr; gap: 13px;
  font-size: 14.5px; color: var(--ink-soft);
}
.spec__body li b { color: var(--ink); font-weight: 600; }
.spec__files {
  display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px;
}

/* ---------- meta strip ---------- */
.meta-strip {
  display: flex; gap: 8px; flex-wrap: wrap;
  margin: 22px 0 12px;
}
.chip {
  display: inline-flex; align-items: center;
  padding: 3px 9px;
  border: 1px solid var(--line-soft); border-radius: 5px;
  font-family: var(--mono); font-size: 12px;
  color: var(--ink-soft);
  background: var(--surface);
}
.chip--accent { color: var(--accent); border-color: var(--accent); background: var(--accent-tint); }
.chip--ochre  { color: var(--ochre); border-color: var(--ochre); background: var(--ochre-tint); }
.chip--clay   { color: var(--clay); border-color: var(--clay); background: var(--clay-tint); }
.chip--add    { color: var(--added); border-color: var(--added-border); }
.chip--del    { color: var(--removed); border-color: var(--removed-border); }

/* ---------- arch legend ---------- */
.arch-legend {
  display: flex; flex-wrap: wrap; gap: 18px; align-items: center;
  background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 16px;
  margin: 20px 0 0;
  font-family: var(--mono); font-size: 12px;
  color: var(--ink-soft);
}
.arch-legend__label {
  color: var(--ink-faint);
  text-transform: uppercase; letter-spacing: .08em;
  font-size: 11px;
}
.arch-legend__item { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
.arch-legend__chip {
  display: inline-block; width: 22px; height: 14px; border-radius: 3px;
}
.arch-legend__chip--added {
  background: #b3d4c4; border: 3px solid #0d4234;
}
.arch-legend__chip--changed {
  background: #b8c8e1; border: 3px solid #1c3a6b;
}
.arch-legend__chip--context {
  background: #ece5d5; border: 2px dashed #5b5347;
}
:root[data-theme="dark"] .arch-legend__chip--added {
  background: #1f4f3a; border-color: #3fb950;
}
:root[data-theme="dark"] .arch-legend__chip--changed {
  background: #1f3a5a; border-color: #58a6ff;
}
:root[data-theme="dark"] .arch-legend__chip--context {
  background: #21262d; border-color: #8b949e;
}
.arch-legend__edges {
  margin-left: auto;
  color: var(--ink-faint);
  font-size: 11.5px;
}

/* ---------- Mermaid (architecture) ---------- */
.mmd-wrap {
  position: relative;
  border: 1px solid var(--line); border-radius: 12px;
  background:
    radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0)
    0 0 / 24px 24px var(--surface);
  margin-top: 26px;
  overflow: hidden;
  min-height: 540px;
  box-shadow: var(--shadow);
}
.mmd-inner {
  position: relative;
  width: 100%; height: 760px;
  overflow: hidden;
  cursor: grab;
}
.mmd-inner:active { cursor: grabbing; }
.mmd-inner .mermaid {
  transform-origin: 0 0;
  padding: 24px;
  white-space: normal;
}
.mmd-inner svg {
  background: transparent !important;
  display: block;
}
.mmd-inner svg .node rect,
.mmd-inner svg .node polygon,
.mmd-inner svg .node circle,
.mmd-inner svg .node ellipse {
  rx: 8; ry: 8;
}
.mmd-inner svg .nodeLabel,
.mmd-inner svg .label {
  font-family: var(--mono) !important;
  font-size: 13px;
}
/* Subgraph cluster boxes — these need stronger contrast than the default
   Mermaid theme provides, otherwise the kind grouping (UI / Services /
   Data / etc.) gets lost against the dotted-grid canvas background. */
.mmd-inner svg .cluster rect {
  rx: 12; ry: 12;
  fill: rgba(0,0,0,0.045) !important;
  stroke: var(--ink-soft) !important;
  stroke-width: 1.5px !important;
  stroke-dasharray: 6 6;
}
:root[data-theme="dark"] .mmd-inner svg .cluster rect {
  fill: rgba(255,255,255,0.04) !important;
  stroke: #8b949e !important;
  stroke-width: 1.5px !important;
}
.mmd-inner svg .cluster text {
  font-family: var(--mono) !important;
  font-size: 12px !important;
  font-weight: 600 !important;
  letter-spacing: .08em;
  text-transform: uppercase;
  fill: var(--ink) !important;
}
.mmd-inner svg .edgeLabel {
  font-family: var(--mono) !important;
  font-size: 11.5px !important;
  background: var(--surface) !important;
  padding: 2px 6px !important;
  border-radius: 4px;
}
.mmd-inner svg .node[id*="n_"] rect,
.mmd-inner svg .node[id*="n_"] polygon {
  cursor: pointer;
}
.mmd-hint {
  position: absolute; top: 12px; left: 16px;
  font-family: var(--mono); font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: .04em; text-transform: uppercase;
  pointer-events: none; z-index: 3;
  opacity: .75;
}

/* ---------- canvas (database + flow diagrams) ---------- */
.canvas {
  position: relative;
  height: 720px;
  border: 1px solid var(--line); border-radius: 12px;
  overflow: hidden;
  background:
    radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0)
    0 0 / 24px 24px var(--surface);
  margin-top: 26px;
  box-shadow: var(--shadow);
}
.canvas__scene {
  position: absolute; top: 0; left: 0; transform-origin: 0 0;
}
.canvas__controls {
  position: absolute; bottom: 12px; right: 12px;
  display: flex; gap: 4px;
  background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px;
  padding: 4px;
  z-index: 2;
  box-shadow: var(--shadow);
}
.canvas__controls button {
  background: transparent; color: var(--ink-soft); border: 0;
  padding: 4px 8px;
  cursor: pointer; font-size: 12px; border-radius: 4px;
}
.canvas__controls button:hover { background: var(--line); color: var(--ink); }

.canvas__hint {
  position: absolute; top: 12px; left: 12px;
  font-family: var(--mono); font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: .04em; text-transform: uppercase;
  pointer-events: none; opacity: .8;
  z-index: 2;
}

.canvas__edges {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  overflow: visible;
}
.canvas__edges path {
  stroke: var(--ink-faint); stroke-width: 1.6; fill: none;
}
.canvas__edges path.is-async   { stroke-dasharray: 6 4; }
.canvas__edges path.is-data    { stroke: var(--changed); }
.canvas__edges path.is-added   { stroke: var(--added); }
.canvas__edges path.is-dimmed  { opacity: 0.35; stroke-dasharray: 3 3; }
.canvas__edges path.is-focus-dim { opacity: .08; transition: opacity .12s ease; }
.canvas__edges .edge-arrow { fill: var(--ink-faint); }
.canvas__edges .edge-label {
  fill: var(--ink); font-size: 11.5px;
  font-family: var(--mono);
  paint-order: stroke;
  stroke: var(--surface); stroke-width: 4px;
}

/* ---------- UML / ER cards ----------
   Selector scoped to div.node so it doesn't collide with Mermaid's
   <g class="node"> elements in the architecture diagram, which already
   carry a `transform="translate(X,Y)"` attribute. A bare .node:hover
   transform would stack on top and produce jitter as the user mouses
   over Mermaid boxes. */
div.node {
  position: absolute;
  min-width: 220px; max-width: 320px;
  background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px;
  cursor: pointer;
  transition: transform 100ms ease, border-color 100ms ease, box-shadow 100ms ease;
  font-family: var(--mono);
  box-shadow: var(--shadow);
}
div.node:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
  box-shadow: var(--shadow-lift);
}
div.node.is-dimmed { opacity: 0.3; transition: opacity .12s ease; }
div.node.is-dragging {
  cursor: grabbing;
  box-shadow: var(--shadow-lift);
  z-index: 5;
  user-select: none;
  transition: none;  /* skip the hover-lift transition during a drag */
}
div.node--draggable { cursor: grab; }
div.node--draggable:hover { cursor: grab; }
div.node--draggable.is-dragging { cursor: grabbing; }
.node__head {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
  font-size: 13px; font-weight: 600;
  color: var(--ink);
}
.node__kind {
  font-size: 10px; color: var(--ink-faint);
  text-transform: uppercase; letter-spacing: .04em;
  background: var(--paper-tint);
  padding: 2px 6px; border-radius: 4px;
  border: 1px solid var(--line-soft);
}
.node__body {
  padding: 8px 12px; font-size: 12.5px;
  color: var(--ink-soft);
}
.node__body ul { margin: 0; padding-left: 16px; list-style: disc; }
.node__body li { margin: 3px 0; }

.node.is-added   { border-color: var(--added-border); }
.node.is-added .node__head   { background: var(--added-tint); }
.node.is-changed { border-color: var(--changed-border); }
.node.is-changed .node__head { background: var(--changed-tint); }
.node.is-removed { border-color: var(--removed-border); border-style: dashed; }
.node.is-removed .node__head { background: var(--removed-tint); }
.node.is-context { border-color: var(--line); }

.status-chip {
  display: inline-flex;
  padding: 1px 7px; border-radius: 4px;
  font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .04em;
  margin-left: auto;
  font-family: var(--mono);
}
.status-chip.is-added   { background: var(--added-tint); color: var(--added); }
.status-chip.is-changed { background: var(--changed-tint); color: var(--changed); }
.status-chip.is-removed { background: var(--removed-tint); color: var(--removed); }

/* ---------- ER field rows ---------- */
.field-row {
  display: grid; grid-template-columns: 1fr auto auto;
  gap: 8px; padding: 5px 12px;
  font-size: 12px;
  border-left: 3px solid transparent;
  color: var(--ink-soft);
}
.field-row + .field-row { border-top: 1px solid var(--line-soft); }
.field-row__name { color: var(--ink); }
.field-row__type { color: var(--ink-faint); }
.field-row.is-added   { border-left-color: var(--added); background: var(--added-tint); }
.field-row.is-changed { border-left-color: var(--changed); background: var(--changed-tint); }
.field-row.is-removed { border-left-color: var(--removed); background: var(--removed-tint); }
.field-row.is-privacy { box-shadow: inset 3px 0 0 var(--privacy); }

/* ---------- Flow (UML sequence diagram) ---------- */
.flow-seq {
  border: 1px solid var(--line); border-radius: 12px;
  background:
    radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0)
    0 0 / 24px 24px var(--surface);
  margin-top: 26px;
  overflow-x: auto;
  box-shadow: var(--shadow);
}
.flow-seq__actors {
  position: relative; height: 64px;
  border-bottom: 1px solid var(--line);
  background: var(--paper-tint);
}
.flow-actor {
  position: absolute; top: 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--surface);
  border: 1px solid var(--ink-faint); border-radius: 6px;
  padding: 8px 14px;
  font-family: var(--mono); font-size: 12px;
  box-shadow: var(--shadow);
}
.flow-actor__kind {
  font-size: 9.5px; color: var(--ink-faint);
  text-transform: uppercase; letter-spacing: .05em;
}
.flow-actor__label {
  font-weight: 600; color: var(--ink);
  margin-top: 2px;
}
.flow-seq__stage { position: relative; }
.flow-seq__lifelines, .flow-seq__messages {
  position: absolute; top: 0; left: 0;
  overflow: visible;
}
.flow-seq__lifelines { pointer-events: none; }
.flow-seq__messages { pointer-events: auto; }
.flow-seq__messages rect { pointer-events: auto; }
.flow-seq__lifeline {
  stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 4 6;
}
.flow-seq__msg {
  stroke: var(--ink-soft); stroke-width: 1.6; fill: none;
}
.flow-seq__msg.is-changed {
  stroke: var(--changed); stroke-width: 2;
}
.flow-seq__label {
  fill: var(--ink); font-size: 12.5px;
  font-family: var(--mono);
  paint-order: stroke;
  stroke: var(--surface); stroke-width: 4px;
}
.flow-seq__num {
  fill: var(--accent); font-size: 10px; font-weight: 500;
  font-family: var(--mono);
  paint-order: stroke;
  stroke: var(--surface); stroke-width: 3px;
}

/* ---------- timeline ---------- */
.timeline {
  display: flex; flex-direction: column; gap: 0;
  margin-top: 28px;
  border-left: 1px solid var(--line);
  padding-left: 0;
}
.tl {
  display: grid; grid-template-columns: 26px 1fr; gap: 16px;
  padding: 0 0 22px;
}
.tl:last-child { padding-bottom: 0; }
.tl__pip {
  width: 13px; height: 13px; border-radius: 50%;
  background: var(--paper); border: 2px solid var(--accent);
  margin-left: -7px; margin-top: 4px;
}
.tl--ochre .tl__pip { border-color: var(--ochre); }
.tl h3 { font-size: 17px; margin-bottom: 2px; }
.tl p { font-size: 14px; margin: 0; }

/* ---------- detail panel ---------- */
.detail-panel {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(480px, 92vw);
  background: var(--surface);
  border-left: 1px solid var(--line);
  padding: 28px 30px;
  overflow-y: auto;
  z-index: 50;
  transform: translateX(0); transition: transform 180ms ease;
  box-shadow: var(--shadow-lift);
}
.detail-panel[hidden] { display: block; transform: translateX(100%); }
.detail-panel__close {
  position: absolute; top: 16px; right: 16px;
  background: transparent; color: var(--ink-faint); border: 0;
  cursor: pointer; font-size: 22px; line-height: 1;
}
.detail-panel__close:hover { color: var(--ink); }
.detail-panel__body h3 {
  font-family: var(--serif); font-weight: 500;
  margin: 0 0 6px; font-size: 22px;
  color: var(--ink);
}
.detail-panel__body h4 {
  font-family: var(--mono); margin: 18px 0 6px;
  font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--ink-faint); font-weight: 500;
}
.detail-panel__body p { margin: 6px 0; color: var(--ink-soft); }
.detail-panel__body ul { margin: 6px 0; padding-left: 20px; color: var(--ink-soft); }

/* ---------- footer / PR card ---------- */
.footer {
  padding: 60px 0 90px;
  max-width: 820px;
}
.pr-card {
  background: var(--accent-deep);
  border-radius: 14px;
  padding: 32px 32px;
  color: var(--paper);
  box-shadow: var(--shadow-lift);
}
:root[data-theme="dark"] .pr-card { background: var(--accent-tint); border: 1px solid var(--accent); }
.pr-card__k {
  font-family: var(--mono); font-size: 11px;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--accent-tint);
  margin-bottom: 10px;
}
:root[data-theme="dark"] .pr-card__k { color: var(--accent); }
.pr-card__h {
  color: var(--paper);
  font-family: var(--serif); font-weight: 500;
  font-size: 24px;
  margin-bottom: 10px;
}
:root[data-theme="dark"] .pr-card__h { color: var(--ink); }
.pr-card__p {
  font-size: 14.5px; line-height: 1.55;
  color: var(--accent-tint);
  margin-bottom: 18px;
}
:root[data-theme="dark"] .pr-card__p { color: var(--ink-soft); }
.pr-card__a {
  display: inline-flex; align-items: center; gap: 9px;
  background: var(--ochre); color: var(--accent-deep);
  font-family: var(--mono); font-size: 13px; font-weight: 500;
  padding: 10px 18px; border-radius: 8px;
  text-decoration: none;
  transition: .2s;
}
.pr-card__a:hover { transform: translateY(-2px); }

/* ---------- responsive ---------- */
@media (max-width: 980px) {
  .shell { grid-template-columns: 1fr; }
  nav.rail { display: none; }
  main.main { padding: 0 24px; }
  .hero, .section, .footer { max-width: none; }
  .principles { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}

      lines.push('  classDef context fill:#ece5d5,stroke:#5b5347,stroke-width:2px,color:#211e19,stroke-dasharray:4 4');
    }

    a.nodes.forEach((n) => {
      const status = a.details?.[n.id]?.status ?? (n.changed ? 'changed' : 'context');
      lines.push(`  class ${sid(n.id)} ${status}`);
    });

    // Click handlers wire each node id to a stored detail-panel entry.
    a.nodes.forEach((n) => {
      const key = detailKey + ':' + n.id;
      lines.push(`  click ${sid(n.id)} call __archDetailFor("${key}")`);
    });

    return lines.join('\n');
  }

  function runMermaid(mmdHost, afterRender) {
    const init = () => {
      const theme = document.documentElement.getAttribute('data-theme') || 'paper';
      const paper = theme === 'paper';
      window.mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose', // needed for click call directives
        flowchart: { htmlLabels: true, curve: 'basis', useMaxWidth: false, nodeSpacing: 30, rankSpacing: 55, padding: 12 },
        theme: 'base',
        themeVariables: paper ? {
          fontFamily: 'IBM Plex Mono, ui-monospace, Menlo, monospace',
          background: '#fbf9f3',
          primaryColor: '#fbf9f3',
          primaryBorderColor: '#ddd4bf',
          primaryTextColor: '#211e19',
          lineColor: '#5b5347',
          secondaryColor: '#f0e6cf',
          tertiaryColor: '#e3ece6',
          // Cluster contrast: pale fill vs ink-soft border so subgraph groups
          // read clearly without competing with the node colors.
          clusterBkg: 'rgba(0,0,0,0.045)',
          clusterBorder: '#5b5347',
          edgeLabelBackground: '#fbf9f3',
        } : {
          fontFamily: 'IBM Plex Mono, ui-monospace, Menlo, monospace',
          background: '#161b22',
          primaryColor: '#161b22',
          primaryBorderColor: '#30363d',
          primaryTextColor: '#e6edf3',
          lineColor: '#c9d1d9',
          secondaryColor: '#21262d',
          tertiaryColor: 'rgba(63,185,80,0.15)',
          clusterBkg: 'rgba(255,255,255,0.04)',
          clusterBorder: '#8b949e',
          edgeLabelBackground: '#161b22',
        },
      });
      window.mermaid.run({ nodes: [mmdHost] }).then(afterRender);
    };
    if (window.mermaid) init();
    else {
      const wait = () => window.mermaid ? init() : setTimeout(wait, 30);
      wait();
    }
  }

  function wireMermaidInteractions(mmdHost, a, scrollWrap) {
    // Store per-node detail HTML keyed by `${graphId}:${nodeId}` so the
    // Mermaid-generated click directives can find them.
    a.nodes.forEach((n) => {
      const d = a.details?.[n.id];
      const files = (d?.files ?? []).map((f) => `<span class="file-chip">${escapeHTML(f)}</span>`).join(' ');
      const resp  = (d?.responsibilities ?? []).map((r) => `<li>${escapeHTML(r)}</li>`).join('');
      const status = d?.status ?? (n.changed ? 'changed' : 'context');
      window.__archDetail[mmdHost.id + ':' + n.id] = `
        <h3>${escapeHTML(n.label)}</h3>
        <p>
          <span class="chip">${escapeHTML(n.kind || 'module')}</span>
          ${status !== 'context' ? `<span class="status-chip is-${status}" style="margin-left:6px">${status}</span>` : ''}
        </p>
        ${d?.summary ? `<p>${escapeHTML(d.summary)}</p>` : ''}
        ${resp ? `<h4>Responsibilities</h4><ul>${resp}</ul>` : ''}
        ${files ? `<h4>Files</h4><div class="spec__files">${files}</div>` : ''}
      `;
    });

    // Pin the SVG element to its viewBox dimensions in CSS pixels so the
    // browser doesn't pre-shrink content. Panzoom is then the ONLY scaler.
    const svgEl = mmdHost.querySelector('svg');
    if (!svgEl) return;
    const vbAttr = svgEl.getAttribute('viewBox');
    if (vbAttr) {
      const [, , vbW, vbH] = vbAttr.split(/\s+/).map(Number);
      if (vbW && vbH) {
        svgEl.style.width  = vbW + 'px';
        svgEl.style.height = vbH + 'px';
      }
    }
    svgEl.style.maxWidth = 'none';
    svgEl.style.display = 'block';

    if (typeof window.panzoom === 'function') {
      const pz = window.panzoom(svgEl, {
        smoothScroll: false,
        minZoom: 0.3, maxZoom: 4,
        beforeWheel: (e) => !e.ctrlKey && !e.metaKey,
        beforeMouseDown: (e) => !!e.target.closest?.('.node'),
      });
      scrollWrap._pz = pz;
      requestAnimationFrame(() => fitMermaid(pz, svgEl, scrollWrap));
    }
  }

  function fitMermaid(pz, svgEl, container) {
    if (!pz) return;
    const bbox = svgEl.getBBox();
    if (!bbox || !bbox.width) return;
    const padding = 24;
    const cw = container.clientWidth;
    const ch = container.clientHeight;
    // Compute the SVG's CSS-rendered position (it lives inside an absolutely
    // positioned scene). Account for negative-origin viewBoxes by reading
    // the viewBox attribute directly.
    const vb = (svgEl.getAttribute('viewBox') || '0 0 0 0').split(/\s+/).map(Number);
    const vbX = vb[0] || 0, vbY = vb[1] || 0;
    // Width fit: scale so the diagram exactly fills the container width.
    // Height fit: separately, ensure we don't zoom in past 1.4x for tiny
    // diagrams, and don't shrink below ~0.5 for very large ones.
    let scale = (cw - padding * 2) / bbox.width;
    scale = Math.min(scale, 1.4);
    scale = Math.max(scale, 0.5);
    pz.zoomAbs(0, 0, scale);
    // Center horizontally; pin to top vertically with padding.
    const renderedW = bbox.width * scale;
    const renderedX = (bbox.x - vbX) * scale;
    const renderedY = (bbox.y - vbY) * scale;
    const offsetX = (cw - renderedW) / 2 - renderedX;
    const offsetY = padding - renderedY;
    pz.moveTo(offsetX, offsetY);
  }

  function mmdControls(scrollWrap) {
    const controls = el('div', { class: 'canvas__controls' }, [
      el('button', { type: 'button', 'data-zoom': 'in',    title: 'Zoom in' }, '+'),
      el('button', { type: 'button', 'data-zoom': 'out',   title: 'Zoom out' }, '−'),
      el('button', { type: 'button', 'data-zoom': 'fit',   title: 'Fit' }, '⤢'),
      el('button', { type: 'button', 'data-zoom': 'reset', title: 'Reset' }, '⟲'),
    ]);
    controls.addEventListener('click', (e) => {
      const action = e.target.getAttribute?.('data-zoom');
      const pz = scrollWrap._pz;
      if (!action || !pz) return;
      const rect = scrollWrap.getBoundingClientRect();
      if (action === 'in')    pz.smoothZoom(rect.width / 2, rect.height / 2, 1.25);
      if (action === 'out')   pz.smoothZoom(rect.width / 2, rect.height / 2, 0.8);
      if (action === 'reset') { pz.zoomAbs(0, 0, 1); pz.moveTo(0, 0); }
      if (action === 'fit') {
        const svgEl = scrollWrap.querySelector('svg');
        if (svgEl) fitMermaid(pz, svgEl, scrollWrap);
      }
    });
    return controls;
  }

  function renderFlow(host, f) {
    host.appendChild(el('p', {}, 'A real UML sequence — actors at the top, time flows down, each numbered step is a message from one actor to another.'));

    if (!f.actors.length) {
      host.appendChild(el('p', {}, 'No flow steps to render.'));
      return;
    }

    const headerH = 64, headerGapY = 36, stepGapY = 56, padding = 32, minActorW = 140, actorGapX = 40;

    const wrap     = el('div', { class: 'flow-seq' });
    const headerRow= el('div', { class: 'flow-seq__actors' });
    const stage    = el('div', { class: 'flow-seq__stage' });
    const lifeSvg  = svg('svg', { class: 'flow-seq__lifelines' });
    const msgSvg   = svg('svg', { class: 'flow-seq__messages' });
    stage.appendChild(lifeSvg);
    stage.appendChild(msgSvg);
    wrap.appendChild(headerRow);
    wrap.appendChild(stage);
    host.appendChild(wrap);

    const actorEls = f.actors.map((a) => {
      const card = el('div', { class: 'flow-actor', 'data-actor': a.id }, [
        el('span', { class: 'flow-actor__kind' }, a.kind || ''),
        el('span', { class: 'flow-actor__label' }, a.label),
      ]);
      headerRow.appendChild(card);
      return { actor: a, card };
    });

    requestAnimationFrame(() => {
      const actorW = actorEls.map(({ card }) => Math.max(minActorW, card.offsetWidth));
      const totalNatural = actorW.reduce((a, b) => a + b, 0) + actorGapX * (actorEls.length - 1);
      const availW = Math.max(stage.clientWidth - padding * 2, totalNatural);
      const extra  = Math.max(0, availW - totalNatural);
      const perGap = actorEls.length > 1 ? extra / (actorEls.length - 1) : 0;

      const actorX = [];
      let cursor = padding;
      actorEls.forEach(({ card }, i) => {
        actorX.push(cursor + actorW[i] / 2);
        card.style.left = cursor + 'px';
        card.style.width = actorW[i] + 'px';
        cursor += actorW[i] + actorGapX + perGap;
      });
      const stageW = cursor + padding - actorGapX - perGap;
      const stageH = headerGapY + stepGapY * f.steps.length + padding;

      stage.style.width = stageW + 'px';
      stage.style.height = stageH + 'px';
      [lifeSvg, msgSvg].forEach((s) => {
        s.setAttribute('width', stageW);
        s.setAttribute('height', stageH);
        s.setAttribute('viewBox', `0 0 ${stageW} ${stageH}`);
      });

      while (lifeSvg.firstChild) lifeSvg.removeChild(lifeSvg.firstChild);
      actorX.forEach((x) => {
        const line = svg('line', { x1: x, x2: x, y1: 0, y2: stageH, class: 'flow-seq__lifeline' });
        lifeSvg.appendChild(line);
      });

      while (msgSvg.firstChild) msgSvg.removeChild(msgSvg.firstChild);
      appendArrowDef(msgSvg);
      const idx = new Map(f.actors.map((a, i) => [a.id, i]));
      f.steps.forEach((s, i) => {
        const fi = idx.get(s.from);
        const ti = idx.get(s.to);
        if (fi == null || ti == null) return;
        const y = headerGapY + stepGapY * (i + 0.5);
        const isSelf = fi === ti;
        let path, labelX, labelAnchor;
        if (isSelf) {
          const x = actorX[fi];
          path = svg('path', { d: `M ${x} ${y - 8} L ${x + 36} ${y - 8} L ${x + 36} ${y + 8} L ${x + 4} ${y + 8}` });
          labelX = x + 40; labelAnchor = 'start';
        } else {
          const fx = actorX[fi], tx = actorX[ti];
          path = svg('line', { x1: fx, y1: y, x2: tx, y2: y });
          const goingRight = tx > fx;
          labelX = goingRight ? fx + 8 : fx - 8;
          labelAnchor = goingRight ? 'start' : 'end';
        }
        path.setAttribute('marker-end', 'url(#edge-arrow)');
        path.setAttribute('class', 'flow-seq__msg' + (s.changed ? ' is-changed' : ''));
        msgSvg.appendChild(path);

        const availW = isSelf ? 140 : Math.abs(actorX[ti] - actorX[fi]) - 16;
        const maxChars = Math.max(20, Math.floor(availW / 7.2));
        const display = s.label.length > maxChars ? s.label.slice(0, maxChars - 1) + '…' : s.label;
        const text = svg('text', { x: labelX, y: y - 6, 'text-anchor': labelAnchor, class: 'flow-seq__label' });
        text.textContent = display;
        if (display !== s.label) {
          const t = svg('title'); t.textContent = s.label; text.appendChild(t);
        }
        msgSvg.appendChild(text);

        const num = svg('text', {
          x: actorX[fi] + (isSelf ? 0 : (actorX[ti] > actorX[fi] ? 10 : -10)),
          y: y + 4,
          'text-anchor': isSelf ? 'middle' : (actorX[ti] > actorX[fi] ? 'start' : 'end'),
          class: 'flow-seq__num',
        });
        num.textContent = (i + 1).toString();
        msgSvg.appendChild(num);

        const hit = svg('rect', {
          x: Math.min(labelX - 100, actorX[Math.min(fi, ti)]),
          y: y - 18,
          width: Math.max(200, Math.abs(actorX[ti] - actorX[fi]) + 40),
          height: 28,
          fill: 'transparent',
        });
        hit.style.cursor = 'pointer';
        hit.addEventListener('click', () => {
          const fromLabel = f.actors[fi]?.label || s.from;
          const toLabel   = f.actors[ti]?.label || s.to;
          openDetail(
            `<h3>Step ${i + 1}: ${escapeHTML(s.label)}</h3>` +
            `<p><strong>${escapeHTML(fromLabel)}</strong> → <strong>${escapeHTML(toLabel)}</strong></p>` +
            (s.changed ? `<p><span class="status-chip is-changed">~ changed</span></p>` : '')
          );
        });
        msgSvg.appendChild(hit);
      });
    });
  }

  function renderDatabase(host, d) {
    host.appendChild(el('p', {}, [
      el('span', {}, 'Tables and columns this branch adds, changes, or removes. Field rows are color-coded — green rows are new, blue are modified — amber strips mark privacy-sensitive fields. '),
      el('strong', {}, 'Drag any table '),
      el('span', {}, 'to reposition it (relations re-route live), or '),
      el('strong', {}, 'click '),
      el('span', {}, 'for its full field list and write/read paths.'),
    ]));

    const wrap = mountCanvas(host, { allowCardDrag: true });
    wrap.canvas.appendChild(el('div', { class: 'canvas__hint' }, 'drag tables · hover to focus · ctrl + wheel to zoom'));

    const byId = new Map();
    const links = (d.relations || []).map((r) => ({
      from: r.from.split('.')[0],
      to:   r.to.split('.')[0],
      status: r.status,
    }));

    d.tables.forEach((t) => {
      const card = el('div', {
        class: `node node--draggable is-${t.status}`,
        style: 'min-width:260px;',
      }, [
        el('div', { class: 'node__head' }, [
          el('span', { class: 'node__kind' }, 'tbl'),
          el('span', {}, t.name),
          t.status !== 'context' ? el('span', { class: `status-chip is-${t.status}` }, ({ added: '+ added', changed: '~ changed', removed: '− removed' })[t.status]) : null,
        ]),
        el('div', { class: 'node__body', style: 'padding:0;' },
          t.fields.map((f) => {
            const explicit = f.status === 'added' ? 'field-row is-added'
                            : f.status === 'changed' ? 'field-row is-changed'
                            : f.status === 'removed' ? 'field-row is-removed'
                            : 'field-row';
            return el('div', { class: explicit + (f.privacy ? ' is-privacy' : '') }, [
              el('span', { class: 'field-row__name' }, f.name),
              el('span', { class: 'field-row__type' }, f.type),
              f.status !== 'context' ? el('span', { class: `status-chip is-${f.status}` }, f.status) : null,
            ]);
          })
        ),
      ]);
      card.setAttribute('data-detail-source', t.id);
      card.addEventListener('click', (e) => {
        e.stopPropagation();
        openDetail(detailForTable(t));
      });
      wrap.scene.appendChild(card);
      byId.set(t.id, card);
    });

    requestAnimationFrame(() => {
      reflowAndDraw({
        scene: wrap.scene, edges: wrap.edges, byId,
        nodes: d.tables, links,
        drawLink: drawRelationEdge,
      });
      wireDrag(wrap, byId, links, drawRelationEdge);
      if (wrap.pz) fitToContent(wrap.pz, wrap.scene, wrap.canvas);
    });

    function detailForTable(t) {
      const fields = t.fields.map((f) =>
        `<li><code>${escapeHTML(f.name)}</code> · ${escapeHTML(f.type)} · <em>${escapeHTML(f.status)}</em>${f.privacy ? ' · <strong>pii</strong>' : ''}</li>`
      ).join('');
      const details = t.details || {};
      const detailLines = Object.entries(details).map(([k, v]) =>
        `<p><strong>${escapeHTML(k)}:</strong> ${escapeHTML(String(v))}</p>`
      ).join('');
      return `
        <h3>${escapeHTML(t.name)} <span class="status-chip is-${t.status}">${escapeHTML(t.status)}</span></h3>
        ${detailLines || ''}
        <h4>Fields</h4><ul>${fields}</ul>
      `;
    }
  }

  // ============================================================
  // Canvas / panzoom / layout
  // ============================================================

  function mountCanvas(parent, opts = {}) {
    const canvas = el('div', { class: 'canvas' });
    const scene  = el('div', { class: 'canvas__scene' });
    const edges  = svg('svg', { class: 'canvas__edges' });
    const controls = el('div', { class: 'canvas__controls' }, [
      el('button', { type: 'button', 'data-zoom': 'in',    title: 'Zoom in' }, '+'),
      el('button', { type: 'button', 'data-zoom': 'out',   title: 'Zoom out' }, '−'),
      el('button', { type: 'button', 'data-zoom': 'fit',   title: 'Fit' }, '⤢'),
      el('button', { type: 'button', 'data-zoom': 'reset', title: 'Reset' }, '⟲'),
    ]);
    scene.appendChild(edges);
    canvas.appendChild(scene);
    canvas.appendChild(controls);
    parent.appendChild(canvas);

    let pz = null;
    if (typeof window.panzoom === 'function') {
      pz = window.panzoom(scene, {
        smoothScroll: false,
        beforeWheel: (e) => !e.ctrlKey && !e.metaKey,
        // When card-drag is enabled for this canvas, panzoom must yield to
        // the card's own mousedown handler — otherwise the canvas pans
        // instead of the card moving.
        beforeMouseDown: opts.allowCardDrag
          ? (e) => !!e.target.closest?.('.node--draggable')
          : undefined,
      });
    }
    controls.addEventListener('click', (e) => {
      const action = e.target.getAttribute?.('data-zoom');
      if (!action || !pz) return;
      if (action === 'in')    pz.smoothZoom(canvas.clientWidth / 2, canvas.clientHeight / 2, 1.25);
      if (action === 'out')   pz.smoothZoom(canvas.clientWidth / 2, canvas.clientHeight / 2, 0.8);
      if (action === 'reset') { pz.zoomAbs(0, 0, 1); pz.moveTo(0, 0); }
      if (action === 'fit')   fitToContent(pz, scene, canvas);
    });
    canvas.addEventListener('dblclick', () => pz && fitToContent(pz, scene, canvas));
    return { canvas, scene, edges, pz };
  }

  function fitToContent(pz, scene, canvas) {
    const rects = [...scene.children].filter((c) => c.classList?.contains('node')).map((c) => ({
      x: parseFloat(c.style.left || 0),
      y: parseFloat(c.style.top  || 0),
      w: c.offsetWidth, h: c.offsetHeight,
    }));
    if (!rects.length) return;
    const minX = Math.min(...rects.map((r) => r.x));
    const minY = Math.min(...rects.map((r) => r.y));
    const maxX = Math.max(...rects.map((r) => r.x + r.w));
    const maxY = Math.max(...rects.map((r) => r.y + r.h));
    const w = maxX - minX, h = maxY - minY;
    if (w < 1 || h < 1) return;
    const scale = Math.min(canvas.clientWidth / (w + 80), canvas.clientHeight / (h + 80), 1);
    pz.zoomAbs(0, 0, scale);
    pz.moveTo(-(minX - 40) * scale, -(minY - 40) * scale);
  }

  function reflowAndDraw({ scene, edges, byId, nodes, links, drawLink }) {
    if (nodes.length === 0) return;
    const layer = assignLayers(nodes, links);
    const maxLayer = Math.max(0, ...layer.values());
    const layerGroups = Array.from({ length: maxLayer + 1 }, () => []);
    nodes.forEach((n) => layerGroups[layer.get(n.id)].push(n.id));

    const padding = 32, colGap = 110, rowGap = 28;
    const layerWidths = layerGroups.map((ids) =>
      ids.reduce((w, id) => Math.max(w, byId.get(id)?.offsetWidth || 0), 0)
    );
    const colX = [];
    let cursor = padding;
    layerWidths.forEach((w) => { colX.push(cursor); cursor += w + colGap; });
    const sceneW = cursor - colGap + padding;

    const colY = new Array(maxLayer + 1).fill(padding);
    layerGroups.forEach((ids, c) => {
      ids.forEach((id) => {
        const card = byId.get(id);
        if (!card) return;
        const cardX = colX[c] + (layerWidths[c] - card.offsetWidth) / 2;
        card.style.left = cardX + 'px';
        card.style.top  = colY[c] + 'px';
        colY[c] += card.offsetHeight + rowGap;
      });
    });
    const sceneH = Math.max(padding * 2, ...colY) + padding;

    scene.style.width  = sceneW + 'px';
    scene.style.height = sceneH + 'px';
    edges.setAttribute('viewBox', `0 0 ${sceneW} ${sceneH}`);
    edges.setAttribute('width',  sceneW);
    edges.setAttribute('height', sceneH);

    redrawEdges(edges, byId, links, drawLink);
    scene.appendChild(edges); // paint over cards so labels are never hidden

    wireFocus(scene, edges, links);
  }

  function redrawEdges(edges, byId, links, drawLink) {
    while (edges.firstChild) edges.removeChild(edges.firstChild);
    appendArrowDef(edges);
    const fanOut = new Map();
    links.forEach((link, i) => {
      const k = link.from;
      if (!fanOut.has(k)) fanOut.set(k, []);
      fanOut.get(k).push(i);
    });
    links.forEach((link, i) => {
      const siblings = fanOut.get(link.from) || [i];
      const slot = siblings.indexOf(i);
      const lane = (slot + 1) / (siblings.length + 1);
      drawLink(link, byId, edges, { lane, scene: edges.parentElement });
    });
  }

  function assignLayers(nodes, links) {
    const layer = new Map(nodes.map((n) => [n.id, 0]));
    const incoming = new Map(nodes.map((n) => [n.id, []]));
    for (const l of links) {
      if (incoming.has(l.to)) incoming.get(l.to).push(l.from);
    }
    for (let pass = 0; pass < nodes.length + 1; pass++) {
      let changed = false;
      nodes.forEach((n) => {
        const ins = incoming.get(n.id) || [];
        if (ins.length === 0) return;
        const want = Math.max(...ins.map((id) => (layer.get(id) ?? 0) + 1));
        if (want > layer.get(n.id)) { layer.set(n.id, want); changed = true; }
      });
      if (!changed) break;
    }
    const cap = 5;
    layer.forEach((v, k) => { if (v > cap) layer.set(k, cap); });
    return layer;
  }

  function wireFocus(scene, edges, links) {
    const cards = Array.from(scene.querySelectorAll('.node'));
    const linkPaths = Array.from(edges.querySelectorAll('path:not(.edge-arrow), line'));
    const byFrom = new Map(), byTo = new Map();
    links.forEach((l, i) => {
      if (!byFrom.has(l.from)) byFrom.set(l.from, []);
      if (!byTo.has(l.to)) byTo.set(l.to, []);
      byFrom.get(l.from).push(i);
      byTo.get(l.to).push(i);
    });
    const clear = () => {
      cards.forEach((c) => c.classList.remove('is-dimmed'));
      linkPaths.forEach((p) => p.classList.remove('is-focus-dim'));
    };
    const focus = (id) => {
      const related = new Set([id]);
      (byFrom.get(id) || []).forEach((i) => related.add(links[i].to));
      (byTo.get(id) || []).forEach((i) => related.add(links[i].from));
      cards.forEach((c) => c.classList.toggle('is-dimmed', !related.has(c.getAttribute('data-detail-source'))));
      linkPaths.forEach((p, i) => {
        const link = links[i];
        const active = link && (link.from === id || link.to === id);
        p.classList.toggle('is-focus-dim', !active);
      });
    };
    cards.forEach((c) => c.addEventListener('mouseenter', () => focus(c.getAttribute('data-detail-source'))));
    const cv = scene.parentElement;
    if (cv) cv.addEventListener('mouseleave', clear);
  }

  // Wire drag-to-reposition on every .node--draggable card. Edges re-route
  // live during the drag; the scene grows to fit when a card is moved past
  // the current bounds.
  function wireDrag(wrap, byId, links, drawLink) {
    const scene = wrap.scene;
    const edges = wrap.edges;
    const cards = Array.from(scene.querySelectorAll('.node--draggable'));
    let drag = null;
    cards.forEach((card) => {
      card.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        e.stopPropagation();
        e.preventDefault();
        const sceneRect = scene.getBoundingClientRect();
        const scale = sceneRect.width / scene.offsetWidth || 1;
        drag = {
          card,
          startX: e.clientX, startY: e.clientY,
          origLeft: parseFloat(card.style.left || 0),
          origTop:  parseFloat(card.style.top  || 0),
          scale,
        };
        card.classList.add('is-dragging');
      });
    });
    document.addEventListener('mousemove', (e) => {
      if (!drag) return;
      const dx = (e.clientX - drag.startX) / drag.scale;
      const dy = (e.clientY - drag.startY) / drag.scale;
      drag.card.style.left = (drag.origLeft + dx) + 'px';
      drag.card.style.top  = (drag.origTop  + dy) + 'px';
      redrawEdges(edges, byId, links, drawLink);
      scene.appendChild(edges);
    });
    document.addEventListener('mouseup', () => {
      if (!drag) return;
      drag.card.classList.remove('is-dragging');
      growSceneToFit(scene, edges);
      redrawEdges(edges, byId, links, drawLink);
      scene.appendChild(edges);
      drag = null;
    });
  }

  function growSceneToFit(scene, edges) {
    let maxRight = 0, maxBottom = 0;
    Array.from(scene.children).forEach((c) => {
      if (!c.classList?.contains('node')) return;
      const right  = parseFloat(c.style.left || 0) + c.offsetWidth;
      const bottom = parseFloat(c.style.top  || 0) + c.offsetHeight;
      if (right > maxRight)   maxRight = right;
      if (bottom > maxBottom) maxBottom = bottom;
    });
    const w = Math.max(scene.offsetWidth, maxRight + 60);
    const h = Math.max(scene.offsetHeight, maxBottom + 60);
    scene.style.width  = w + 'px';
    scene.style.height = h + 'px';
    edges.setAttribute('width',  w);
    edges.setAttribute('height', h);
    edges.setAttribute('viewBox', `0 0 ${w} ${h}`);
  }

  // ---------- arrow def + edge drawers ----------
  function appendArrowDef(svgEl) {
    const defs = svg('defs');
    const marker = svg('marker', {
      id: 'edge-arrow', viewBox: '0 0 10 10',
      refX: 9, refY: 5, markerWidth: 7, markerHeight: 7,
      orient: 'auto-start-reverse',
    });
    const arrow = svg('path', { d: 'M 0 0 L 10 5 L 0 10 z', class: 'edge-arrow' });
    arrow.setAttribute('fill', 'currentColor');
    marker.appendChild(arrow);
    defs.appendChild(marker);
    svgEl.appendChild(defs);
  }

  function routePath(fromCard, toCard, opts = {}) {
    const lane = typeof opts.lane === 'number' ? opts.lane : 0.5;
    const fl = parseFloat(fromCard.style.left), ft = parseFloat(fromCard.style.top);
    const fw = fromCard.offsetWidth,             fh = fromCard.offsetHeight;
    const tl = parseFloat(toCard.style.left),    tt = parseFloat(toCard.style.top);
    const tw = toCard.offsetWidth,               th = toCard.offsetHeight;
    const fcx = fl + fw / 2, fcy = ft + fh / 2;
    const tcx = tl + tw / 2, tcy = tt + th / 2;
    const dx = tcx - fcx;
    const dy = tcy - fcy;
    if (Math.abs(dx) >= Math.abs(dy)) {
      const goingRight = dx >= 0;
      const fx = goingRight ? fl + fw : fl;
      const fy = ft + fh / 2 + (lane - 0.5) * (fh - 16);
      const tx = goingRight ? tl : tl + tw;
      const ty = tt + th / 2;
      const elbowX = fx + (tx - fx) * (0.5 + (lane - 0.5) * 0.4);
      return `M ${fx} ${fy} L ${elbowX} ${fy} L ${elbowX} ${ty} L ${tx} ${ty}`;
    } else {
      const goingDown = dy >= 0;
      const fx = fl + fw / 2;
      const fy = goingDown ? ft + fh : ft;
      const tx = tl + tw / 2;
      const ty = goingDown ? tt : tt + th;
      const elbowY = fy + (ty - fy) * (0.5 + (lane - 0.5) * 0.4);
      return `M ${fx} ${fy} L ${fx} ${elbowY} L ${tx} ${elbowY} L ${tx} ${ty}`;
    }
  }

  function appendEdgeLabel(svgEl, fromCard, toCard, label, scene, opts = {}) {
    const lane = typeof opts.lane === 'number' ? opts.lane : 0.5;
    const fl = parseFloat(fromCard.style.left), ft = parseFloat(fromCard.style.top);
    const fw = fromCard.offsetWidth,             fh = fromCard.offsetHeight;
    const tl = parseFloat(toCard.style.left),    tt = parseFloat(toCard.style.top);
    const tw = toCard.offsetWidth,               th = toCard.offsetHeight;
    const dx = (tl + tw / 2) - (fl + fw / 2);
    const dy = (tt + th / 2) - (ft + fh / 2);
    const horizontal = Math.abs(dx) >= Math.abs(dy);

    let lx, ly, anchor;
    if (horizontal) {
      const goingRight = dx >= 0;
      const fx = goingRight ? fl + fw : fl;
      const tx = goingRight ? tl : tl + tw;
      const fy = ft + fh / 2 + (lane - 0.5) * (fh - 16);
      const ty = tt + th / 2;
      const elbowX = fx + (tx - fx) * (0.5 + (lane - 0.5) * 0.4);
      lx = elbowX; ly = (fy + ty) / 2 + 4; anchor = 'middle';
    } else {
      const goingDown = dy >= 0;
      const fy = goingDown ? ft + fh : ft;
      const ty = goingDown ? tt : tt + th;
      const fx = fl + fw / 2;
      const tx = tl + tw / 2;
      const elbowY = fy + (ty - fy) * (0.5 + (lane - 0.5) * 0.4);
      lx = (fx + tx) / 2; ly = elbowY - 6; anchor = 'middle';
    }

    if (scene) {
      for (const node of scene.children) {
        if (node === fromCard || node === toCard) continue;
        if (!node.classList?.contains('node')) continue;
        const nl = parseFloat(node.style.left || 0), nt = parseFloat(node.style.top || 0);
        const nw = node.offsetWidth, nh = node.offsetHeight;
        if (lx >= nl - 4 && lx <= nl + nw + 4 && ly >= nt - 4 && ly <= nt + nh + 4) return;
      }
    }

    const MAX = 22;
    const display = label.length > MAX ? label.slice(0, MAX - 1) + '…' : label;
    const text = svg('text', { x: lx, y: ly, 'text-anchor': anchor, class: 'edge-label' });
    text.textContent = display;
    if (display !== label) {
      const title = svg('title');
      title.textContent = label;
      text.appendChild(title);
    }
    svgEl.appendChild(text);
  }

  function drawArchEdge(e, byId, svgEl, opts = {}) {
    const fromCard = byId.get(e.from); const toCard = byId.get(e.to);
    if (!fromCard || !toCard) return;
    const path = svg('path', { d: routePath(fromCard, toCard, opts), 'marker-end': 'url(#edge-arrow)' });
    path.setAttribute('data-from', e.from);
    path.setAttribute('data-to', e.to);
    if (e.kind === 'async') path.classList.add('is-async');
    if (e.kind === 'data')  path.classList.add('is-data');
    svgEl.appendChild(path);
    if (e.label) appendEdgeLabel(svgEl, fromCard, toCard, e.label, opts.scene || svgEl.parentElement, opts);
  }

  function drawRelationEdge(r, byId, svgEl, opts = {}) {
    const fromCard = byId.get(r.from); const toCard = byId.get(r.to);
    if (!fromCard || !toCard) return;
    const path = svg('path', { d: routePath(fromCard, toCard, opts), 'marker-end': 'url(#edge-arrow)' });
    path.setAttribute('data-from', r.from);
    path.setAttribute('data-to', r.to);
    if (r.status === 'removed') path.classList.add('is-dimmed');
    if (r.status === 'added')   path.classList.add('is-added');
    svgEl.appendChild(path);
  }

  Object.assign(window.__pro, { el, escapeHTML, openDetail, closeDetail });
})();
</script>
</body>
