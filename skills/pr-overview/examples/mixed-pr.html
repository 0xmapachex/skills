<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PR Overview</title>
  <style>/* pr-overview visual system — editorial / HUD aesthetic */

:root[data-theme="dark"] {
  --bg:          #0e1116;
  --bg-elev:    #161b22;
  --fg:          #e6edf3;
  --fg-muted:    #8b949e;
  --border:      #30363d;
  --border-hi:   #484f58;
  --added:       #3fb950;
  --changed:     #58a6ff;
  --removed:     #f85149;
  --privacy:     #d29922;
  --shadow:      0 0 0 1px transparent;
}
:root[data-theme="light"] {
  --bg:          #f7f8fa;
  --bg-elev:    #ffffff;
  --fg:          #1f2328;
  --fg-muted:    #57606a;
  --border:      #d0d7de;
  --border-hi:   #8c959f;
  --added:       #1a7f37;
  --changed:     #0969da;
  --removed:     #cf222e;
  --privacy:     #9a6700;
  --shadow:      0 0 0 1px transparent;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: Inter, ui-sans-serif, system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.45;
}

/* ===== Header ===== */
.pr-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  gap: 16px;
}
.pr-header__title { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
.pr-header__meta { display: flex; gap: 6px; flex-wrap: wrap; }
.pr-header__tags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.pr-header__right button {
  background: transparent; color: var(--fg); border: 1px solid var(--border);
  border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 14px;
}
.pr-header__right button:hover { border-color: var(--border-hi); }

/* ===== Chips ===== */
.chip {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border: 1px solid var(--border); border-radius: 4px;
  font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; font-size: 12px;
  color: var(--fg);
}
.chip--muted { color: var(--fg-muted); }
.chip--arrow { border: 0; padding: 2px 2px; color: var(--fg-muted); }
.chip--add { color: var(--added); border-color: var(--added); }
.chip--del { color: var(--removed); border-color: var(--removed); }
.chip--tag { background: var(--bg-elev); }

/* ===== Sections ===== */
.pr-main { padding: 24px; max-width: 1400px; margin: 0 auto; }
.pr-section { margin-bottom: 40px; }
.pr-section__title {
  font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--fg-muted); margin: 0 0 12px; font-weight: 600;
}

/* ===== Summary ===== */
.summary-bullets { margin: 0; padding-left: 20px; }
.summary-bullets li { margin: 4px 0; }

/* ===== Canvas (panzoom viewport) ===== */
.canvas {
  position: relative;
  height: 720px;
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
  background:
    radial-gradient(circle at 1px 1px, var(--border) 1px, transparent 0)
    0 0 / 24px 24px var(--bg);
}
/* Width/height get set by JS after layout measures card heights. */
.canvas__scene {
  position: absolute; top: 0; left: 0; transform-origin: 0 0;
}
.canvas__controls {
  position: absolute; bottom: 12px; right: 12px; display: flex; gap: 4px;
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: 4px;
  padding: 4px; z-index: 2;
}
.canvas__controls button {
  background: transparent; color: var(--fg); border: 0; padding: 4px 8px;
  cursor: pointer; font-size: 12px; border-radius: 2px;
}
.canvas__controls button:hover { background: var(--border); }

/* SVG lives inside .canvas__scene so paths pan/zoom with the cards. The
   pointer-events:none lets clicks pass through to the cards beneath.
   width/height:100% means the SVG fills the JS-sized scene — without these
   the SVG collapses to 0×0 and paths render invisibly. */
.canvas__edges {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  color: var(--border-hi);
  overflow: visible;
}
.canvas__edges path {
  stroke: var(--border-hi); stroke-width: 1.6; fill: none;
}
.canvas__edges path.is-async   { stroke-dasharray: 6 4; }
.canvas__edges path.is-data    { stroke: var(--changed); }
.canvas__edges path.is-added   { stroke: var(--added); }
.canvas__edges path.is-dimmed  { opacity: 0.35; stroke-dasharray: 3 3; }
.canvas__edges .edge-arrow     { fill: var(--border-hi); }
.canvas__edges .edge-label {
  fill: var(--fg-muted);
  font-size: 11px;
  font-family: ui-monospace, "JetBrains Mono", Menlo, monospace;
  paint-order: stroke;
  stroke: var(--bg);
  stroke-width: 4px;
}

/* Hover-focus: dim cards and edges not connected to the hovered card. */
.node.is-dimmed { opacity: 0.25; transition: opacity 120ms ease; }
.canvas__edges path.is-focus-dim { opacity: 0.08; transition: opacity 120ms ease; }

/* ===== UML / ER cards ===== */
.node {
  position: absolute;
  min-width: 200px; max-width: 280px;
  background: var(--bg-elev);
  border: 1px solid var(--border); border-radius: 4px;
  cursor: pointer; transition: transform 100ms ease, border-color 100ms ease;
  font-family: ui-monospace, "JetBrains Mono", Menlo, monospace;
}
.node:hover { transform: translateY(-2px); border-color: var(--border-hi); }
.node__head {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-bottom: 1px solid var(--border);
  font-size: 13px; font-weight: 600;
}
.node__kind { font-size: 11px; color: var(--fg-muted); }
.node__body { padding: 8px 10px; font-size: 12px; color: var(--fg-muted); }
.node__body ul { margin: 0; padding-left: 16px; }
.node__body li { margin: 2px 0; }

.node.is-added   { border-color: var(--added); }
.node.is-changed { border-color: var(--changed); }
.node.is-removed { border-color: var(--removed); border-style: dashed; }
.node.is-context { border-color: var(--border); }

.status-chip {
  display: inline-flex; padding: 1px 6px; border-radius: 2px;
  font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
  margin-left: auto;
}
.status-chip.is-added   { background: rgba(63,185,80,0.15); color: var(--added); }
.status-chip.is-changed { background: rgba(88,166,255,0.15); color: var(--changed); }
.status-chip.is-removed { background: rgba(248,81,73,0.15); color: var(--removed); }

/* ===== ER field rows ===== */
.field-row {
  display: grid; grid-template-columns: 1fr auto auto;
  gap: 6px; padding: 4px 10px; font-size: 12px;
  border-left: 3px solid transparent;
}
.field-row + .field-row { border-top: 1px solid var(--border); }
.field-row__name { color: var(--fg); }
.field-row__type { color: var(--fg-muted); }
.field-row.is-added   { border-left-color: var(--added); }
.field-row.is-changed { border-left-color: var(--changed); }
.field-row.is-removed { border-left-color: var(--removed); }
.field-row.is-privacy { box-shadow: inset 3px 0 0 var(--privacy); }

/* ===== Flow lanes ===== */
.flow-lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0; }
.flow-lane { border-right: 1px dashed var(--border); padding: 8px; min-height: 360px; }
.flow-lane:last-child { border-right: 0; }
.flow-lane__header { font-size: 12px; color: var(--fg-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em; }
.flow-step { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; margin: 6px 0; cursor: pointer; font-size: 12px; }
.flow-step.is-changed { border-color: var(--changed); }

/* ===== Prose cards (observations, risk, open questions) ===== */
.prose-card {
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: 4px;
  padding: 12px 14px; margin: 8px 0;
}
.prose-card__title { font-size: 13px; font-weight: 600; margin: 0 0 4px; display: flex; justify-content: space-between; gap: 8px; }
.prose-card__body { color: var(--fg-muted); font-size: 13px; margin: 4px 0 0; }
.prose-card__files { margin-top: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
.file-chip {
  display: inline-flex; padding: 2px 6px; font-size: 11px;
  border: 1px solid var(--border); border-radius: 2px; cursor: copy;
  font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; color: var(--fg-muted);
}
.file-chip:hover { border-color: var(--border-hi); color: var(--fg); }

.kind-chip { font-size: 10px; padding: 1px 6px; border-radius: 2px; border: 1px solid var(--border); color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.04em; }

/* ===== Detail panel ===== */
.detail-panel {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(480px, 92vw);
  background: var(--bg-elev); border-left: 1px solid var(--border);
  padding: 20px 24px; overflow-y: auto; z-index: 50;
  transform: translateX(0); transition: transform 180ms ease;
}
.detail-panel[hidden] { display: block; transform: translateX(100%); }
.detail-panel__close {
  position: absolute; top: 12px; right: 12px;
  background: transparent; color: var(--fg-muted); border: 0; cursor: pointer;
  font-size: 20px; line-height: 1;
}
.detail-panel__close:hover { color: var(--fg); }
.detail-panel__body h3 { margin: 0 0 4px; font-size: 15px; }
.detail-panel__body h4 { margin: 16px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--fg-muted); }
.detail-panel__body p { margin: 4px 0; }
.detail-panel__body ul { margin: 4px 0; padding-left: 18px; }

/* ===== Minimap ===== */
.minimap {
  position: absolute; top: 12px; right: 12px;
  width: 160px; height: 100px;
  border: 1px solid var(--border); background: var(--bg-elev);
  z-index: 2; opacity: 0.85;
}
</style>
</head>
<body>
  <header class="pr-header">
    <div class="pr-header__left">
      <h1 class="pr-header__title" data-bind="meta.title"></h1>
      <div class="pr-header__meta">
        <span class="chip" data-bind="meta.base"></span>
        <span class="chip chip--arrow">→</span>
        <span class="chip" data-bind="meta.head"></span>
        <span class="chip chip--muted" data-bind="meta.files_changed" data-suffix=" files"></span>
        <span class="chip chip--add" data-bind="meta.additions" data-prefix="+"></span>
        <span class="chip chip--del" data-bind="meta.deletions" data-prefix="−"></span>
      </div>
      <div class="pr-header__tags" data-list="meta.pr_type_tags" data-item-class="chip chip--tag"></div>
    </div>
    <div class="pr-header__right">
      <button type="button" data-theme-toggle aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <main class="pr-main">
    <!-- Section renderers mount themselves in here based on which keys are present in the spec. -->
  </main>

  <aside class="detail-panel" data-detail-panel hidden>
    <button type="button" class="detail-panel__close" data-detail-close aria-label="Close panel">×</button>
    <div class="detail-panel__body" data-detail-body></div>
  </aside>

    const colX = [];
    let cursor = padding;
    layerWidths.forEach((w) => { colX.push(cursor); cursor += w + colGap; });
    const sceneW = cursor - colGap + padding;

    // Stack cards in each layer.
    const colY = new Array(maxLayer + 1).fill(padding);
    layerGroups.forEach((ids, c) => {
      ids.forEach((id) => {
        const card = byId.get(id);
        if (!card) return;
        // Center each card horizontally inside its layer's column width.
        const cardX = colX[c] + (layerWidths[c] - card.offsetWidth) / 2;
        card.style.left = cardX + 'px';
        card.style.top  = colY[c] + 'px';
        colY[c] += card.offsetHeight + rowGap;
      });
    });
    const sceneH = Math.max(padding * 2, ...colY) + padding;

    scene.style.width  = sceneW + 'px';
    scene.style.height = sceneH + 'px';
    edges.setAttribute('viewBox', `0 0 ${sceneW} ${sceneH}`);
    edges.setAttribute('width',  sceneW);
    edges.setAttribute('height', sceneH);

    while (edges.firstChild) edges.removeChild(edges.firstChild);
    appendArrowDef(edges);

    // Distribute multiple edges between the same pair so they don't overlap.
    // Also bucket edges per source card so each gets its own exit Y.
    const fanOut = new Map(); // sourceId -> [edgeIndices...]
    links.forEach((link, i) => {
      const k = link.from;
      if (!fanOut.has(k)) fanOut.set(k, []);
      fanOut.get(k).push(i);
    });

    links.forEach((link, i) => {
      const siblings = fanOut.get(link.from) || [i];
      const slot = siblings.indexOf(i);
      const lane = (slot + 1) / (siblings.length + 1); // 0..1, never 0 or 1
      drawLink(link, byId, edges, { lane, scene });
    });

    // Move SVG to the end of scene so labels paint OVER cards (with
    // pointer-events:none so clicks still hit cards beneath).
    scene.appendChild(edges);

    // Wire hover focus on cards: dim all unrelated cards + edges.
    wireFocus(scene, edges, links);
  }

  // Longest-path layer assignment over a DAG. For cycles we fall back to the
  // source's layer + 1 (still safe because each node's layer is monotonically
  // non-decreasing).
  function assignLayers(nodes, links) {
    const layer = new Map(nodes.map((n) => [n.id, 0]));
    const incoming = new Map(nodes.map((n) => [n.id, []]));
    for (const l of links) {
      if (incoming.has(l.to)) incoming.get(l.to).push(l.from);
    }
    // Iterate until stable, capped to avoid infinite loops on cycles.
    for (let pass = 0; pass < nodes.length + 1; pass++) {
      let changed = false;
      nodes.forEach((n) => {
        const ins = incoming.get(n.id) || [];
        if (ins.length === 0) return;
        const want = Math.max(...ins.map((id) => (layer.get(id) ?? 0) + 1));
        if (want > layer.get(n.id)) {
          layer.set(n.id, want);
          changed = true;
        }
      });
      if (!changed) break;
    }
    // Cap at a reasonable max — wider diagrams get hard to read past ~5 layers.
    const cap = 5;
    layer.forEach((v, k) => { if (v > cap) layer.set(k, cap); });
    return layer;
  }

  function wireFocus(scene, edges, links) {
    const cards = Array.from(scene.querySelectorAll('.node'));
    const linkPaths = Array.from(edges.querySelectorAll('path:not(.edge-arrow)'));
    const linksByFrom = new Map();
    const linksByTo = new Map();
    links.forEach((l, i) => {
      if (!linksByFrom.has(l.from)) linksByFrom.set(l.from, []);
      if (!linksByTo.has(l.to)) linksByTo.set(l.to, []);
      linksByFrom.get(l.from).push(i);
      linksByTo.get(l.to).push(i);
    });

    const clearDim = () => {
      cards.forEach((c) => c.classList.remove('is-dimmed'));
      linkPaths.forEach((p) => p.classList.remove('is-focus-dim'));
    };
    const applyFocus = (id) => {
      const related = new Set([id]);
      (linksByFrom.get(id) || []).forEach((i) => related.add(links[i].to));
      (linksByTo.get(id) || []).forEach((i) => related.add(links[i].from));
      cards.forEach((c) => {
        c.classList.toggle('is-dimmed', !related.has(c.getAttribute('data-detail-source')));
      });
      linkPaths.forEach((p, i) => {
        const link = links[i];
        const active = link && (link.from === id || link.to === id);
        p.classList.toggle('is-focus-dim', !active);
      });
    };
    cards.forEach((c) => {
      c.addEventListener('mouseenter', () => applyFocus(c.getAttribute('data-detail-source')));
    });
    // Clear when the mouse leaves the canvas entirely, NOT when it merely
    // transitions between cards inside the canvas. mouseleave on the canvas
    // container doesn't bubble from children, so it fires only at the boundary.
    const canvas = scene.parentElement; // .canvas
    if (canvas) canvas.addEventListener('mouseleave', clearDim);
  }

  // Reusable arrowhead marker. One <defs> per SVG; drawLink references it.
  function appendArrowDef(svg) {
    const ns = 'http://www.w3.org/2000/svg';
    const defs = document.createElementNS(ns, 'defs');
    const marker = document.createElementNS(ns, 'marker');
    marker.setAttribute('id', 'edge-arrow');
    marker.setAttribute('viewBox', '0 0 10 10');
    marker.setAttribute('refX', '9');
    marker.setAttribute('refY', '5');
    marker.setAttribute('markerWidth', '7');
    marker.setAttribute('markerHeight', '7');
    marker.setAttribute('orient', 'auto-start-reverse');
    const arrow = document.createElementNS(ns, 'path');
    arrow.setAttribute('d', 'M 0 0 L 10 5 L 0 10 z');
    arrow.setAttribute('fill', 'currentColor');
    arrow.setAttribute('class', 'edge-arrow');
    marker.appendChild(arrow);
    defs.appendChild(marker);
    svg.appendChild(defs);
  }

  // Orthogonal "Manhattan" routing: right-angle path with two elbows. The
  // `lane` param (0..1) shifts the elbow point vertically when many edges
  // share the same source, so they don't all stack on top of each other.
  function routePath(fromCard, toCard, opts = {}) {
    const lane = typeof opts.lane === 'number' ? opts.lane : 0.5;
    const fl = parseFloat(fromCard.style.left), ft = parseFloat(fromCard.style.top);
    const fw = fromCard.offsetWidth,             fh = fromCard.offsetHeight;
    const tl = parseFloat(toCard.style.left),    tt = parseFloat(toCard.style.top);
    const tw = toCard.offsetWidth,               th = toCard.offsetHeight;
    const fcx = fl + fw / 2, fcy = ft + fh / 2;
    const tcx = tl + tw / 2, tcy = tt + th / 2;
    const dx = tcx - fcx;
    const dy = tcy - fcy;
    // Source anchor sits a fraction of card height down so multiple edges
    // from the same source exit at different Y positions.
    const sourceOffsetY = (lane - 0.5) * (fh - 16);

    if (Math.abs(dx) >= Math.abs(dy)) {
      // Horizontal-dominant: source right → vertical leg → target left.
      const goingRight = dx >= 0;
      const fx = goingRight ? fl + fw : fl;
      const fy = ft + fh / 2 + sourceOffsetY;
      const tx = goingRight ? tl : tl + tw;
      const ty = tt + th / 2;
      // Elbow X sits between the two cards, biased toward target by lane.
      const elbowX = fx + (tx - fx) * (0.5 + (lane - 0.5) * 0.4);
      return `M ${fx} ${fy} L ${elbowX} ${fy} L ${elbowX} ${ty} L ${tx} ${ty}`;
    } else {
      // Vertical-dominant: source bottom/top → horizontal leg → target top/bottom.
      const goingDown = dy >= 0;
      const fx = fl + fw / 2;
      const fy = goingDown ? ft + fh : ft;
      const tx = tl + tw / 2;
      const ty = goingDown ? tt : tt + th;
      const elbowY = fy + (ty - fy) * (0.5 + (lane - 0.5) * 0.4);
      return `M ${fx} ${fy} L ${fx} ${elbowY} L ${tx} ${elbowY} L ${tx} ${ty}`;
    }
  }

  function drawArchEdge(e, byId, svg, opts = {}) {
    const fromCard = byId.get(e.from); const toCard = byId.get(e.to);
    if (!fromCard || !toCard) return;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', routePath(fromCard, toCard, opts));
    path.setAttribute('marker-end', 'url(#edge-arrow)');
    path.setAttribute('data-from', e.from);
    path.setAttribute('data-to', e.to);
    if (e.kind === 'async') path.classList.add('is-async');
    if (e.kind === 'data')  path.classList.add('is-data');
    svg.appendChild(path);
    if (e.label) appendEdgeLabel(svg, fromCard, toCard, e.label, opts.scene || svg.parentElement, opts);
  }

  function drawRelationEdge(r, byId, svg, opts = {}) {
    const fromCard = byId.get(r.from); const toCard = byId.get(r.to);
    if (!fromCard || !toCard) return;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', routePath(fromCard, toCard, opts));
    path.setAttribute('marker-end', 'url(#edge-arrow)');
    path.setAttribute('data-from', r.from);
    path.setAttribute('data-to', r.to);
    if (r.status === 'removed') path.classList.add('is-dimmed');
    if (r.status === 'added')   path.classList.add('is-added');
    svg.appendChild(path);
  }

  // Position labels on the vertical leg of orthogonal edges — that's the
  // inter-column gap, guaranteed empty space. Per-lane vertical offset
  // staggers labels for edges sharing the same source.
  function appendEdgeLabel(svg, fromCard, toCard, label, scene, opts = {}) {
    const lane = typeof opts.lane === 'number' ? opts.lane : 0.5;
    const fl = parseFloat(fromCard.style.left), ft = parseFloat(fromCard.style.top);
    const fw = fromCard.offsetWidth,             fh = fromCard.offsetHeight;
    const tl = parseFloat(toCard.style.left),    tt = parseFloat(toCard.style.top);
    const tw = toCard.offsetWidth,               th = toCard.offsetHeight;
    const dx = (tl + tw / 2) - (fl + fw / 2);
    const dy = (tt + th / 2) - (ft + fh / 2);
    const horizontal = Math.abs(dx) >= Math.abs(dy);

    let lx, ly, anchor;
    if (horizontal) {
      const goingRight = dx >= 0;
      const fx = goingRight ? fl + fw : fl;
      const tx = goingRight ? tl : tl + tw;
      const fy = ft + fh / 2 + (lane - 0.5) * (fh - 16);
      const ty = tt + th / 2;
      // Elbow X matches routePath. Center label on the vertical leg so it
      // doesn't extend toward either neighbouring card.
      const elbowX = fx + (tx - fx) * (0.5 + (lane - 0.5) * 0.4);
      lx = elbowX;
      ly = (fy + ty) / 2 + 4;
      anchor = 'middle';
    } else {
      const goingDown = dy >= 0;
      const fy = goingDown ? ft + fh : ft;
      const ty = goingDown ? tt : tt + th;
      const fx = fl + fw / 2;
      const tx = tl + tw / 2;
      const elbowY = fy + (ty - fy) * (0.5 + (lane - 0.5) * 0.4);
      lx = (fx + tx) / 2;
      ly = elbowY - 6;
      anchor = 'middle';
    }

    // Skip labels whose anchor falls inside an unrelated card.
    if (scene) {
      for (const node of scene.children) {
        if (node === fromCard || node === toCard) continue;
        if (!node.classList?.contains('node')) continue;
        const nl = parseFloat(node.style.left || 0), nt = parseFloat(node.style.top || 0);
        const nw = node.offsetWidth, nh = node.offsetHeight;
        if (lx >= nl - 4 && lx <= nl + nw + 4 && ly >= nt - 4 && ly <= nt + nh + 4) return;
      }
    }

    // Truncate labels longer than the inter-column gap can fit (~20 chars
    // at 11px mono ≈ 130px). Full label still lives in the spec JSON.
    const MAX = 22;
    const display = label.length > MAX ? label.slice(0, MAX - 1) + '…' : label;

    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', lx);
    text.setAttribute('y', ly);
    text.setAttribute('text-anchor', anchor);
    text.setAttribute('class', 'edge-label');
    text.textContent = display;
    if (display !== label) {
      const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
      title.textContent = label;
      text.appendChild(title);
    }
    svg.appendChild(text);
  }

  // ---------- shared helpers exposed for renderers ----------
  window.__pro = { el, escapeHTML, mountCanvas, openDetail, closeDetail };
})();
</script>
</body>
</html>
