<!DOCTYPE html><html lang="[LANG]"><head><meta charset="utf-8">
<!--
COMPOSITE TEMPLATE (Layer B — the brand layer), authored at FULL resolution 1080x1920.
1. Set the brand tokens in :root.
2. Set --photo to the text-free PNG from Codex.
3. Inline your logo SVG where marked (recolor via fill:currentColor / color).
4. Fill tag / headline / highlight word / subhead / offer / cue.
5. Render: scripts/screenshot.sh ad.html out/ad.png   (1080x1920 full-page screenshot)
Keep .safe-* on while laying out; remove (or set display:none) for the final.
For a 4:5 Feed ad: set height:1350px, shorten the scrims, you may use a real CTA button.
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --photo:url('PHOTO.png');     /* text-free Codex render */
  --text:#F5F5F0;               /* light text */
  --ink:#2D2D2D;                /* dark text on accent */
  --accent:#F0AB1A;             /* brand accent / highlight */
  --font:'Inter',system-ui,sans-serif;
}
html,body{width:1080px;height:1920px}
.ad{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:var(--font);-webkit-font-smoothing:antialiased}
.photo{position:absolute;inset:0;background:var(--photo) center/cover no-repeat}
/* scrim on the text side keeps copy legible; subject side stays clear. Flip the gradient direction if the subject is on the left. */
.scrim{position:absolute;inset:0;background:linear-gradient(to right,rgba(13,11,9,.93) 0%,rgba(13,11,9,.82) 33%,rgba(13,11,9,.34) 60%,rgba(13,11,9,0) 82%)}
.scrim-b{position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(to top,rgba(13,11,9,.72),rgba(13,11,9,.2) 55%,rgba(13,11,9,0))}

.logo{position:absolute;top:92px;left:80px}
.logo svg{height:68px;width:auto;color:var(--text);filter:drop-shadow(0 2px 16px rgba(0,0,0,.45))}

.head{position:absolute;top:500px;left:80px;width:624px}
.tag{color:var(--accent);font-weight:800;font-size:24px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:28px}
.headline{color:var(--text);font-weight:900;font-size:100px;line-height:.99;letter-spacing:-.035em;text-shadow:0 6px 44px rgba(0,0,0,.6)}
.hl{background:var(--accent);color:var(--ink);padding:0 .08em;border-radius:10px;font-weight:900}
.subhead{color:var(--text);font-weight:600;font-size:36px;line-height:1.28;margin-top:36px;text-shadow:0 2px 20px rgba(0,0,0,.7)}
.subhead b{color:var(--accent);font-weight:800}
.offer{margin-top:44px}
.offer .big{display:block;color:var(--accent);font-weight:900;font-size:68px;line-height:1;letter-spacing:-.02em;text-shadow:0 4px 28px rgba(0,0,0,.6)}
.offer .small{display:block;color:var(--text);font-weight:600;font-size:30px;margin-top:14px;opacity:.92}

/* CTA CUE (Stories): text + chevron pointing at the platform's native button. NOT a tappable button. */
.cue{position:absolute;left:80px;bottom:476px;display:flex;align-items:center;gap:18px;color:var(--text);font-weight:800;font-size:34px;text-shadow:0 2px 16px rgba(0,0,0,.6)}
.chev{width:24px;height:24px;border-right:6px solid var(--accent);border-bottom:6px solid var(--accent);transform:rotate(45deg);margin-top:-8px}

/* safe-zone guides — layout aid only; hide for final */
.safe-top{position:absolute;top:0;left:0;right:0;height:250px;background:rgba(255,0,80,.10);border-bottom:2px dashed rgba(255,80,120,.5)}
.safe-bottom{position:absolute;bottom:0;left:0;right:0;height:420px;background:rgba(255,0,80,.10);border-top:2px dashed rgba(255,80,120,.5)}
</style></head>
<body><div class="ad">
  <div class="photo"></div><div class="scrim"></div><div class="scrim-b"></div>

  <div class="logo"><!-- INLINE LOGO SVG HERE; paths use fill="currentColor" -->
    <svg viewBox="0 0 100 100" fill="currentColor"><rect x="10" y="40" width="80" height="20" rx="6"/></svg>
  </div>

  <div class="head">
    <div class="tag">[EYEBROW / CATEGORY]</div>
    <div class="headline">[BLUNT HOOK with one <span class="hl">KEYWORD</span> highlighted]</div>
    <div class="subhead">[one-line relief/claim, with <b>one accent</b>]</div>
    <div class="offer"><span class="big">[OFFER e.g. 7-day free trial]</span><span class="small">[then price / terms]</span></div>
  </div>

  <div class="cue">[CTA cue e.g. "Message us"] <span class="chev"></span></div>

  <div class="safe-top"></div><div class="safe-bottom"></div>
</div></body></html>
